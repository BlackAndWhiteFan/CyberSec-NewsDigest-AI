name: Daily CyberSec Digest

on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Test workflow
        run: python src/main.py
        
