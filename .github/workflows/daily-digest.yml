name: Daily CyberSec Digest

on:
  # Main trigger since v24: the external alarm clock (cron-job.org) calls the
  # GitHub API at 06:17 Polish time, Monday to Saturday, with budzik=true.
  workflow_dispatch:
    inputs:
      budzik:
        description: "Started by the external alarm clock (cron-job.org); leave unchecked for manual runs"
        type: boolean
        default: false
  schedule:
    # Backup: attempts at 06:17, 07:17, 08:17 and 09:17 Polish time, Monday
    # to Saturday (no digest on Sundays). GitHub skips or delays many
    # scheduled starts; src/run_guard.py lets only the first completed
    # scheduled or alarm-clock run of the day send the digest (manual runs
    # always run). The timezone field keeps the hours fixed across daylight
    # saving changes.
    - cron: "17 6-9 * * 1-6"
      timezone: "Europe/Warsaw"

permissions:
  contents: write

# Never run two digests at the same time (e.g. a manual run during the
# scheduled one), so the same articles are not sent twice.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Upper limit for one run; AI requests may wait when rate limited.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Test workflow
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Runs on branches other than main go to the test channel only.
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          # AI summaries (Groq: two models, one key). Without the key the
          # digest is sent without summaries.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # v30: Gemini for the language correction (free quota); without
          # the secret the correction uses the Groq models.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional repository variable: Gemini model names, comma-separated.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # v37a: optional lite Gemini models and Mistral, the last fallback
          # of the language correction (free plan, no card).
          GEMINI_LITE_MODEL: ${{ vars.GEMINI_LITE_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          # "budzik" for the external alarm clock, otherwise the event name;
          # src/run_guard.py treats "budzik" like a scheduled run.
          TRIGGER: ${{ inputs.budzik && 'budzik' || github.event_name }}
        run: python src/main.py

      - name: Persist article history and archive
        # Runs even if the digest step failed, so links already delivered to
        # Discord are still recorded and not sent again the next day.
        if: ${{ !cancelled() }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Article history and archive have not changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update persistent article history and archive"
            # A top workflow may have pushed its marker in the meantime.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      # v31: alarm on the test channel when this workflow fails, so the
      # owner learns about it before the readers do.
      - name: Alarm on failure
        if: ${{ failure() }}
        env:
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_TEST_WEBHOOK_URL" ]; then
            echo "Brak DISCORD_TEST_WEBHOOK_URL – alarm pominięty."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          text = "⚠️ Prasówka: workflow zakończył się błędem (gałąź " + os.environ.get("GITHUB_REF_NAME", "?") + "). Log: <" + os.environ["RUN_URL"] + ">"
          request = urllib.request.Request(
              os.environ["DISCORD_TEST_WEBHOOK_URL"],
              data=json.dumps({"content": text}).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "CyberSec-NewsDigest-AI/1.0"},
          )
          urllib.request.urlopen(request, timeout=20).close()
          print("Alarm wysłany na kanał testowy.")
          PY
