name: Daily CyberSec Digest

on:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Test workflow
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py

      - name: Persist article history
        run: |
          if git diff --quiet -- data/seen_articles.json; then
            echo "Article history has not changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen_articles.json
            git commit -m "Update persistent article history"
            git push
          fi
        
