name: Daily CyberSec Digest

on:
  workflow_dispatch:
  schedule:
    # 06:17 Polish time, Monday to Saturday (no digest on Sundays).
    # The timezone field keeps the hour fixed across daylight saving changes.
    - cron: "17 6 * * 1-6"
      timezone: "Europe/Warsaw"

permissions:
  contents: write

# Never run two digests at the same time (e.g. a manual run during the
# scheduled one), so the same articles are not sent twice.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Test workflow
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python src/main.py

      - name: Persist article history and archive
        # Runs even if the digest step failed, so links already delivered to
        # Discord are still recorded and not sent again the next day.
        if: ${{ !cancelled() }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Article history and archive have not changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update persistent article history and archive"
            git push
          fi
