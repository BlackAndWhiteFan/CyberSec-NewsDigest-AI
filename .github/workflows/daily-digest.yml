name: Daily CyberSec Digest

on:
  workflow_dispatch:
  schedule:
    # Attempts at 06:17, 07:17, 08:17 and 09:17 Polish time, Monday to
    # Saturday (no digest on Sundays). GitHub skips or delays many scheduled
    # starts, so there are four attempts; src/run_guard.py lets only the
    # first completed run of the day send the digest (manual runs always run).
    # The timezone field keeps the hours fixed across daylight saving changes.
    - cron: "17 6-9 * * 1-6"
      timezone: "Europe/Warsaw"

permissions:
  contents: write

# Never run two digests at the same time (e.g. a manual run during the
# scheduled one), so the same articles are not sent twice.
concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    # Upper limit for one run; AI requests may wait when rate limited.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Test workflow
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Runs on branches other than main go to the test channel only.
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          # AI summaries (Groq: two models, one key). Without the key the
          # digest is sent without summaries.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python src/main.py

      - name: Persist article history and archive
        # Runs even if the digest step failed, so links already delivered to
        # Discord are still recorded and not sent again the next day.
        if: ${{ !cancelled() }}
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "Article history and archive have not changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update persistent article history and archive"
            git push
          fi
