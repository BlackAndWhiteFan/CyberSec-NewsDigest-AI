name: Monthly Top 10

on:
  # Main trigger since v24: the external alarm clock (cron-job.org) calls the
  # GitHub API on the 1st of each month at 08:17 Polish time with budzik=true.
  workflow_dispatch:
    inputs:
      month:
        description: "Month to summarize (YYYY-MM); empty = previous month"
        required: false
        default: ""
      budzik:
        description: "Started by the external alarm clock (cron-job.org); leave unchecked for manual runs"
        type: boolean
        default: false
  schedule:
    # First day of each month, attempts at 08:17, 09:17, 10:17 and 11:17
    # Polish time, for the previous month. GitHub skips or delays many
    # scheduled starts; src/top_guard.py sends each month only once.
    - cron: "17 8-11 1 * *"
      timezone: "Europe/Warsaw"

# Writes only the marker data/last_top.json (which periods were sent).
permissions:
  contents: write

# Shared with the weekly top: both write the same marker file.
concurrency:
  group: top-reports
  cancel-in-progress: false

jobs:
  monthly-top:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit tests
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Send monthly top 10
        env:
          DISCORD_MONTHLY_WEBHOOK_URL: ${{ secrets.DISCORD_MONTHLY_WEBHOOK_URL }}
          # Runs on branches other than main go to the test channel only.
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          MONTH: ${{ inputs.month }}
          # v33: one language correction of the top summaries (Gemini, then Groq).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # "budzik" for the external alarm clock (cron-job.org, v24), otherwise
          # the event name; src/top_guard.py treats "budzik" like a scheduled run.
          TRIGGER: ${{ inputs.budzik && 'budzik' || github.event_name }}
        run: python src/monthly_top.py

      - name: Persist top marker
        run: |
          git add data/last_top.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Top marker has not changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update top marker (monthly)"
            # Another workflow (daily digest) may have pushed in the meantime.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      # v31: alarm on the test channel when this workflow fails, so the
      # owner learns about it before the readers do.
      - name: Alarm on failure
        if: ${{ failure() }}
        env:
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_TEST_WEBHOOK_URL" ]; then
            echo "Brak DISCORD_TEST_WEBHOOK_URL – alarm pominięty."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          text = "⚠️ Top 10 miesiąca: workflow zakończył się błędem (gałąź " + os.environ.get("GITHUB_REF_NAME", "?") + "). Log: <" + os.environ["RUN_URL"] + ">"
          request = urllib.request.Request(
              os.environ["DISCORD_TEST_WEBHOOK_URL"],
              data=json.dumps({"content": text}).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "CyberSec-NewsDigest-AI/1.0"},
          )
          urllib.request.urlopen(request, timeout=20).close()
          print("Alarm wysłany na kanał testowy.")
          PY
