name: Schedule probe (Europe/Warsaw)

on:
  schedule:
    - cron: "7,27,47 * * * *"
      timezone: "Europe/Warsaw"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report trigger time
        run: echo "Schedule probe (Europe/Warsaw) fired at $(date -u)"
