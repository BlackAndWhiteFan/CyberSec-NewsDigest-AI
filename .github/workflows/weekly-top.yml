name: Weekly Top 5

on:
  # Main trigger since v24: the external alarm clock (cron-job.org) calls the
  # GitHub API Mondays at 08:17 Polish time with budzik=true.
  workflow_dispatch:
    inputs:
      week:
        description: "Any date in the week to summarize (YYYY-MM-DD); empty = previous week"
        required: false
        default: ""
      budzik:
        description: "Started by the external alarm clock (cron-job.org); leave unchecked for manual runs"
        type: boolean
        default: false
  schedule:
    # Mondays, attempts at 08:17, 09:17, 10:17 and 11:17 Polish time, for
    # the previous week (Monday–Sunday). GitHub skips or delays many
    # scheduled starts; src/top_guard.py sends each week only once.
    - cron: "17 8-11 * * 1"
      timezone: "Europe/Warsaw"

# Writes the marker data/last_top.json (which periods were sent) and,
# since v38, the delivered top to data/tops/<period>.json.
permissions:
  contents: write

# Shared with the monthly top: both write the same marker file.
concurrency:
  group: top-reports
  cancel-in-progress: false

# v38: Python output goes to the log line by line, not at the end of the step.
env:
  PYTHONUNBUFFERED: "1"

jobs:
  weekly-top:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Morfeusz 2
        # v42: Polish dictionary for the word checks (src/polish_words.py).
        # Without it the checks are skipped, so a failed install never stops
        # the run.
        continue-on-error: true
        run: python -m pip install --quiet morfeusz2==1.99.15 || python -m pip install --quiet --break-system-packages morfeusz2==1.99.15

      - name: Run unit tests
        run: python -m unittest discover -s src -p "test_*.py"

      - name: Send weekly top 5
        env:
          DISCORD_WEEKLY_WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_WEBHOOK_URL }}
          # Runs on branches other than main go to the test channel only.
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          WEEK: ${{ inputs.week }}
          # v33: language correction of the top summaries; v37b: Gemini, lite, Mistral.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # v37b: the same correction chain as the digest – lite Gemini
          # models and Mistral (free plan), the last fallback.
          GEMINI_LITE_MODEL: ${{ vars.GEMINI_LITE_MODEL }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: ${{ vars.MISTRAL_MODEL }}
          # "budzik" for the external alarm clock (cron-job.org, v24), otherwise
          # the event name; src/top_guard.py treats "budzik" like a scheduled run.
          TRIGGER: ${{ inputs.budzik && 'budzik' || github.event_name }}
        run: python src/weekly_top.py

      - name: Persist top marker
        run: |
          git add data/last_top.json data/tops 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Top marker has not changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update top marker (weekly)"
            # Another workflow (daily digest) may have pushed in the meantime.
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      # v31: alarm on the test channel when this workflow fails, so the
      # owner learns about it before the readers do.
      - name: Alarm on failure
        if: ${{ failure() }}
        env:
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_TEST_WEBHOOK_URL" ]; then
            echo "Brak DISCORD_TEST_WEBHOOK_URL – alarm pominięty."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          text = "⚠️ Top 5 tygodnia: workflow zakończył się błędem (gałąź " + os.environ.get("GITHUB_REF_NAME", "?") + "). Log: <" + os.environ["RUN_URL"] + ">"
          request = urllib.request.Request(
              os.environ["DISCORD_TEST_WEBHOOK_URL"],
              data=json.dumps({"content": text}).encode("utf-8"),
              headers={"Content-Type": "application/json", "User-Agent": "CyberSec-NewsDigest-AI/1.0"},
          )
          urllib.request.urlopen(request, timeout=20).close()
          print("Alarm wysłany na kanał testowy.")
          PY
